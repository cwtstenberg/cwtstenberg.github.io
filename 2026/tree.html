<html lang="en">
<head>

<title>World Cup 2026 Knockout Stage</title>
<style>
:root{--sand:#F4E7D1;--sand2:#E8D5B7;--cream:#FFF8EA;--navy:#071C33;--navy2:#0D2A4D;--gold:#D4AF37;--gold2:#F2D27B;--ink:#0A1624;--muted:#6D604D;--line:#173653;--paper:rgba(255,248,234,.92);--good:#1F8F5A;--bad:#B53A32}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 6%,rgba(212,175,55,.26),transparent 28%),radial-gradient(circle at 92% 8%,rgba(7,28,51,.18),transparent 31%),linear-gradient(135deg,var(--cream),var(--sand) 48%,var(--sand2));min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(30deg,transparent 47%,rgba(7,28,51,.16) 48%,rgba(7,28,51,.16) 50%,transparent 51%),radial-gradient(circle,rgba(212,175,55,.30) 1px,transparent 1.5px);background-size:72px 72px,26px 26px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:34px 32px 26px;border-bottom:6px solid var(--gold);text-align:center}.hero:before{content:"2026";position:absolute;right:2vw;top:-54px;font-size:clamp(130px,20vw,290px);font-weight:1000;letter-spacing:-.08em;color:rgba(255,255,255,.045);white-space:nowrap}.kicker{position:relative;z-index:1;display:inline-flex;gap:12px;align-items:center;font-weight:1000;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2)}.kicker:before,.kicker:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);display:block}h1{position:relative;z-index:1;margin:10px 0 0;font-size:clamp(42px,7.8vw,118px);line-height:.86;letter-spacing:-.075em;text-transform:uppercase;color:#fff8e8;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 20px 0}.status{font-size:12px;font-weight:900;color:var(--muted);background:rgba(255,248,234,.78);border:1px solid rgba(212,175,55,.38);padding:9px 12px;border-radius:999px}.status.ok{color:var(--good)}.status.err{color:var(--bad)}button{border:1px solid rgba(212,175,55,.65);background:var(--navy);color:white;border-radius:12px;padding:10px 14px;font-weight:1000;cursor:pointer;box-shadow:0 7px 18px rgba(7,28,51,.12)}button:hover{background:var(--gold);color:var(--navy);transform:translateY(-1px)}
.helper{padding:10px 20px 10px;text-align:center;color:var(--muted);font-size:12px;font-weight:850}.wrap{position:relative;padding:10px 20px 34px;overflow-x:auto}.bracket{width:1640px;min-height:860px;margin:0 auto;display:grid;grid-template-columns:228px 170px 170px 170px 230px 170px 170px 170px 228px;grid-template-rows:42px repeat(8,88px);gap:0 26px;position:relative}.roundTitle{align-self:end;text-align:center;color:var(--navy);font-size:12px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;padding-bottom:8px}.card{position:relative;align-self:center;height:74px;border:1px solid rgba(7,28,51,.28);border-radius:8px;background:var(--paper);box-shadow:0 10px 22px rgba(7,28,51,.09);display:flex;overflow:visible;z-index:3}.card.final{height:100px;border:3px solid var(--gold);box-shadow:0 18px 34px rgba(7,28,51,.18),inset 0 0 0 1px rgba(255,255,255,.35);background:linear-gradient(135deg,var(--navy),#12395f);color:white}.card.third{height:86px;background:rgba(212,175,55,.18);border-color:rgba(212,175,55,.6)}.num{width:54px;min-width:54px;background:linear-gradient(135deg,var(--navy),#082847);color:var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:1000;border-radius:7px 0 0 7px;line-height:.92}.num span{color:white;font-size:10px;letter-spacing:.12em}.num b{font-size:31px;letter-spacing:-.05em}.final .num{background:rgba(0,0,0,.28);border-right:1px solid rgba(212,175,55,.45)}.info{padding:6px 9px;flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;min-width:0}.teams{font-size:12.5px;font-weight:1000;line-height:1.18;letter-spacing:-.025em}.vs{display:block;color:var(--gold);font-size:10px;font-weight:1000;margin:1px 0}.seed{display:none}.final .seed,.final .teams{color:white}.final .teams{font-size:13px}.third .teams{font-size:12px}.centerLabel{grid-column:5;grid-row:4/span 2;align-self:end;text-align:center;color:var(--navy);font-size:38px;font-weight:1000;letter-spacing:-.05em;text-transform:uppercase;z-index:2}.centerLabel:before,.centerLabel:after{content:"★";color:var(--gold);font-size:20px;margin:0 16px;vertical-align:middle}.connector{position:absolute;z-index:1;border-color:var(--line);opacity:.95}.h{height:0;border-top:3px solid var(--line)}.v{width:0;border-left:3px solid var(--line)}.dot{position:absolute;width:8px;height:8px;background:var(--line);border-radius:50%;z-index:2;transform:translate(-50%,-50%)}@media(max-width:760px){.hero{padding:28px 18px 20px}.wrap{padding:10px 8px 28px}}
</style>
</head>
<body>
<header class="hero"><div class="kicker">World Cup 2026</div><h1>Knockout Stage</h1></header>
<section class="controls"><button id="refreshBtn">Refresh data</button><div id="status" class="status">Loading published CSV…</div></section>
<div class="helper">Data is fetched from the published Google Sheet on page load, using the same CSV/GViz fallback pattern as standings.html. Scroll sideways if needed.</div>
<div class="wrap"><main class="bracket" id="bracket"></main></div>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTGpUvuPP93ZzIzy7ni6CuRCeKX2XMVq0Nof1GF1OC3Vem8Nn4Om3sah68frwTmSOC4KuyJOphYmBLg/pub?gid=0&single=true&output=csv";
const GVIZ_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTGpUvuPP93ZzIzy7ni6CuRCeKX2XMVq0Nof1GF1OC3Vem8Nn4Om3sah68frwTmSOC4KuyJOphYmBLg/gviz/tq?tqx=out:csv&gid=0";
const TEAM_FLAGS={"Mexico":"🇲🇽","Rep. of Korea":"🇰🇷","Czech Rep.":"🇨🇿","South Africa":"🇿🇦","Switzerland":"🇨🇭","Bosnia/Herzeg.":"🇧🇦","Canada":"🇨🇦","Qatar":"🇶🇦","Brazil":"🇧🇷","Morocco":"🇲🇦","Scotland":"🏴","Haiti":"🇭🇹","Turkey":"🇹🇷","USA":"🇺🇸","United States":"🇺🇸","Australia":"🇦🇺","Paraguay":"🇵🇾","Germany":"🇩🇪","Ecuador":"🇪🇨","Ivory Coast":"🇨🇮","Curaçao":"🇨🇼","Netherlands":"🇳🇱","Japan":"🇯🇵","Sweden":"🇸🇪","Tunisia":"🇹🇳","Belgium":"🇧🇪","Egypt":"🇪🇬","IR Iran":"🇮🇷","New Zealand":"🇳🇿","Spain":"🇪🇸","Uruguay":"🇺🇾","Saudi Arabia":"🇸🇦","Cape Verde":"🇨🇻","France":"🇫🇷","Senegal":"🇸🇳","Norway":"🇳🇴","Iraq":"🇮🇶","Argentina":"🇦🇷","Algeria":"🇩🇿","Austria":"🇦🇹","Jordan":"🇯🇴","Portugal":"🇵🇹","Colombia":"🇨🇴","Uzbekistan":"🇺🇿","DR Congo":"🇨🇩","England":"🏴","Croatia":"🇭🇷","Ghana":"🇬🇭","Panama":"🇵🇦"};
const GROUPS={A:["Mexico","Rep. of Korea","Czech Rep.","South Africa"],B:["Switzerland","Bosnia/Herzeg.","Canada","Qatar"],C:["Brazil","Morocco","Scotland","Haiti"],D:["Turkey","USA","Australia","Paraguay"],E:["Germany","Ecuador","Ivory Coast","Curaçao"],F:["Japan","Netherlands","Sweden","Tunisia"],G:["Belgium","Egypt","IR Iran","New Zealand"],H:["Spain","Uruguay","Saudi Arabia","Cape Verde"],I:["France","Senegal","Norway","Iraq"],J:["Argentina","Algeria","Austria","Jordan"],K:["Portugal","Colombia","Uzbekistan","DR Congo"],L:["England","Croatia","Ghana","Panama"]};
const ALIASES={"south korea":"Rep. of Korea","korea republic":"Rep. of Korea","republic of korea":"Rep. of Korea","czechia":"Czech Rep.","czech republic":"Czech Rep.","bosnia":"Bosnia/Herzeg.","bosnia herzegovina":"Bosnia/Herzeg.","bosnia and herzegovina":"Bosnia/Herzeg.","usa":"USA","united states":"United States","u.s.a":"USA","iran":"IR Iran","curacao":"Curaçao","ivory coast":"Ivory Coast","cote d ivoire":"Ivory Coast","drc":"DR Congo","congo dr":"DR Congo","cape verde":"Cape Verde"};
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[🇦-🇿🏴]/gu,'').replace(/[’']/g,'').replace(/[^a-zA-Z0-9]+/g,' ').trim().toLowerCase()}
const TEAM_BY_NORM={}; Object.values(GROUPS).flat().forEach(t=>TEAM_BY_NORM[norm(t)]=t); Object.entries(ALIASES).forEach(([k,v])=>TEAM_BY_NORM[norm(k)]=v);
function cleanTeam(s){const n=norm(s); return TEAM_BY_NORM[n]||String(s||'').trim()}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function splitCsvLine(line, delimiter){
  let out=[], cell='', inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i], next=line[i+1];
    if(ch==='"'){
      if(inQuotes && next==='"'){ cell+='"'; i++; }
      else inQuotes=!inQuotes;
    }else if(ch===delimiter && !inQuotes){
      out.push(cell); cell='';
    }else cell+=ch;
  }
  out.push(cell);
  return out;
}
function parseCSV(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const firstLine=(text.split(/\r?\n/).find(line=>line.trim().length)||'');
  const candidates=[',',';','\t'];
  let delimiter=',', best=-1;
  for(const cand of candidates){
    const count=splitCsvLine(firstLine,cand).length;
    if(count>best){best=count; delimiter=cand;}
  }
  const rows=[]; let row=[], cell='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch==='"'){
      if(inQuotes && next==='"'){cell+='"'; i++;}
      else inQuotes=!inQuotes;
    }else if(ch===delimiter && !inQuotes){
      row.push(cell); cell='';
    }else if((ch==='\n'||ch==='\r') && !inQuotes){
      if(ch==='\r' && next==='\n') i++;
      row.push(cell); rows.push(row); row=[]; cell='';
    }else cell+=ch;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function emptyCounts(){const out={};for(const g of Object.keys(GROUPS)){out[g]={};GROUPS[g].forEach(t=>out[g][t]=[0,0,0,0])}return out}
function addPick(counts,g,pos,team){team=cleanTeam(team); if(!GROUPS[g]||!GROUPS[g].includes(team)||pos<1||pos>4)return false; counts[g][team][pos-1]++; return true}
function posFromHeader(h){h=String(h||'').toLowerCase(); if(/\b(1st|first|winner|#?1|place 1|position 1)\b/.test(h))return 1; if(/\b(2nd|second|runner|#?2|place 2|position 2)\b/.test(h))return 2; if(/\b(3rd|third|#?3|place 3|position 3)\b/.test(h))return 3; if(/\b(4th|fourth|#?4|place 4|position 4)\b/.test(h))return 4; return null}
function groupFromHeader(h){h=String(h||''); let m=h.match(/group\s*([A-L])/i)||h.match(/grupp\s*([A-L])/i)||h.match(/^\s*([A-L])\s*[-_ ]/i)||h.match(/^\s*([A-L])\s*[1-4]\s*$/i); return m?m[1].toUpperCase():null}
function parseGroupConsensus(rows){const counts=emptyCounts(); let picks=0; if(!rows.length)return {counts,picks};
 const headers=rows[0].map(x=>String(x||'').trim());
 // Format 1: columns like Group, Team, 1st, 2nd, 3rd, 4th with aggregate counts
 const low=headers.map(h=>h.toLowerCase()); const groupCol=low.findIndex(h=>/^group$|grupp/.test(h)), teamCol=low.findIndex(h=>/^team$|lag$/.test(h));
 if(groupCol>=0&&teamCol>=0){const posCols=headers.map(posFromHeader); rows.slice(1).forEach(r=>{const g=String(r[groupCol]||'').trim().toUpperCase().replace(/GROUP|GRUPP/ig,'').trim(); const t=cleanTeam(r[teamCol]); posCols.forEach((p,i)=>{const v=parseFloat(String(r[i]||'').replace(',','.')); if(p&&v>0&&GROUPS[g]?.includes(t)){counts[g][t][p-1]+=v;picks+=v}})}); if(picks)return {counts,picks}}
 // Format 2: columns like Group A 1st / A1 / A - 2nd, each row is a prediction
 const mapped=headers.map(h=>({g:groupFromHeader(h),p:posFromHeader(h)}));
 rows.slice(1).forEach(r=>mapped.forEach((m,i)=>{if(m.g&&m.p&&addPick(counts,m.g,m.p,r[i]))picks++})); if(picks)return {counts,picks};
 // Format 3: detect 4 consecutive team-order columns per group by cell content
 for(const g of Object.keys(GROUPS)){const scores=headers.map((_,ci)=>rows.slice(1).reduce((a,r)=>a+(GROUPS[g].includes(cleanTeam(r[ci]))?1:0),0)); let best=-1,bscore=0; for(let start=0;start<=headers.length-4;start++){const s=scores.slice(start,start+4).reduce((a,b)=>a+b,0); if(s>bscore){bscore=s;best=start}} if(best>=0&&bscore>0){rows.slice(1).forEach(r=>{for(let p=1;p<=4;p++){if(addPick(counts,g,p,r[best+p-1]))picks++}})} }
 return {counts,picks};
}
function rankGroups(counts){const ranks={},third=[];for(const [g,teams] of Object.entries(counts)){const arr=Object.entries(teams).map(([team,c])=>{const total=c.reduce((a,b)=>a+b,0), avg=total?c.reduce((a,b,i)=>a+b*(i+1),0)/total:99, top1=c[0]||0, top2=(c[0]||0)+(c[1]||0);return {team,avg,total,top1,top2,counts:c}}).sort((a,b)=>a.avg-b.avg||b.top1-a.top1||b.top2-a.top2||a.team.localeCompare(b.team));ranks[g]=arr; if(arr[2])third.push({group:g,...arr[2]})}third.sort((a,b)=>a.avg-b.avg||b.top1-a.top1||b.top2-a.top2);return {ranks,third}}
function teamDisplay(team,seed){if(!team)return seed; const flag=TEAM_FLAGS[team]||''; return `${flag?flag+' ':''}${team}`}
function resolveSeed(seed,ranks,third,usedThird){
 let m=seed.match(/^Winner Group ([A-L])$/);
 if(m){let team=ranks[m[1]]?.[0]?.team; return {team:teamDisplay(team,`Group ${m[1]} winner`),seed:''}}
 m=seed.match(/^Runner-up Group ([A-L])$/);
 if(m){let team=ranks[m[1]]?.[1]?.team; return {team:teamDisplay(team,`Group ${m[1]} runner-up`),seed:''}}
 if(seed==='Mexico')return {team:teamDisplay('Mexico','Mexico'),seed:''};
 if(seed==='United States')return {team:teamDisplay('United States','United States'),seed:''};
 m=seed.match(/^3rd Group ([A-L\/]+)$/);
 if(m){
   const allowed=m[1].split('/');
   let pick=third.find(x=>allowed.includes(x.group)&&!usedThird.has(x.group))||third.find(x=>allowed.includes(x.group));
   if(pick){usedThird.add(pick.group); return {team:teamDisplay(pick.team,'Best third-place'),seed:''}}
   return {team:'Best third-place',seed:''}
 }
 return {team:seed,seed:''};
}
const rawMatches={73:['Runner-up Group A','Runner-up Group B'],74:['Winner Group E','3rd Group A/B/C/D/F'],75:['Winner Group F','Runner-up Group C'],76:['Winner Group C','Runner-up Group F'],77:['Winner Group I','3rd Group C/D/F/G/H'],78:['Runner-up Group E','Runner-up Group I'],79:['Mexico','3rd Group C/E/F/H/I'],80:['Winner Group L','3rd Group E/H/I/J/K'],81:['United States','3rd Group B/E/F/I/J'],82:['Winner Group G','3rd Group A/E/H/I/J'],83:['Runner-up Group K','Runner-up Group L'],84:['Winner Group H','Runner-up Group J'],85:['Winner Group B','3rd Group E/F/G/I/J'],86:['Winner Group J','Runner-up Group H'],87:['Winner Group K','3rd Group D/E/I/J/L'],88:['Runner-up Group D','Runner-up Group G'],89:['W74','W77'],90:['W73','W75'],91:['W76','W78'],92:['W79','W80'],93:['W83','W84'],94:['W81','W82'],95:['W86','W88'],96:['W85','W87'],97:['W89','W90'],98:['W93','W94'],99:['W91','W92'],100:['W95','W96'],101:['W97','W98'],102:['W99','W100'],103:['W101','W102'],104:['L101','L102']};
const layout=[['ROUND OF 32',1],['ROUND OF 16',2],['QUARTER-FINALS',3],['SEMI-FINALS',4],['FINAL',5],['SEMI-FINALS',6],['QUARTER-FINALS',7],['ROUND OF 16',8],['ROUND OF 32',9],[74,1,2],[77,1,3],[73,1,4],[75,1,5],[89,2,2.5],[90,2,4.5],[97,3,3.5],[83,1,6],[84,1,7],[81,1,8],[82,1,9],[93,2,6.5],[94,2,8.5],[98,3,7.5],[101,4,5.5],[103,5,5.35,'final'],[104,5,7.35,'third'],[91,8,2.5],[76,9,2],[78,9,3],[92,8,4.5],[79,9,4],[80,9,5],[99,7,3.5],[95,8,6.5],[86,9,6],[88,9,7],[96,8,8.5],[85,9,8],[87,9,9],[100,7,7.5],[102,6,5.5]];
function getMatches(ranks,third){const usedThird=new Set(), out={}; for(const [n,seeds] of Object.entries(rawMatches)){if(+n<=88){const a=resolveSeed(seeds[0],ranks,third,usedThird),b=resolveSeed(seeds[1],ranks,third,usedThird); out[n]=[a,b]}else out[n]=seeds.map(s=>({team:s,seed:''}))} return out}
function render(matches){const bracket=document.getElementById('bracket'); bracket.innerHTML=''; layout.forEach(x=>{if(typeof x[0]==='string'){let d=document.createElement('div');d.className='roundTitle';d.style.gridColumn=x[1];d.style.gridRow=1;d.textContent=x[0];bracket.appendChild(d);return} const m=matches[x[0]],card=document.createElement('section');card.className='card '+(x[3]||'');card.dataset.m=x[0];card.style.gridColumn=x[1];card.style.gridRow=Math.floor(x[2])+(x[2]%1?' / span 2':'');if(x[2]%1)card.style.alignSelf='center';let num=`<span>MATCH</span><b>${x[0]}</b>`; if(x[0]===103)num='<span>MATCH</span><b>FINAL</b>'; if(x[0]===104)num='<span>THIRD</span><b>PLACE</b>'; card.innerHTML=`<div class="num">${num}</div><div class="info"><div class="teams">${esc(m[0].team)}<span class="vs">vs</span>${esc(m[1].team)}</div></div>`;bracket.appendChild(card)}); let lab=document.createElement('div');lab.className='centerLabel';lab.textContent='Final';bracket.appendChild(lab); addConnectors()}
function add(cls,style){const d=document.createElement('i');d.className='connector '+cls;Object.assign(d.style,style);document.getElementById('bracket').appendChild(d)}
function connect(a,b,side='right'){const A=document.querySelector(`[data-m="${a}"]`).getBoundingClientRect(),B=document.querySelector(`[data-m="${b}"]`).getBoundingClientRect(),P=document.getElementById('bracket').getBoundingClientRect();const ax=(side==='right'?A.right:A.left)-P.left,ay=A.top+A.height/2-P.top,bx=(side==='right'?B.left:B.right)-P.left,by=B.top+B.height/2-P.top,mid=(ax+bx)/2;add('h',{left:Math.min(ax,mid)+'px',top:ay+'px',width:Math.abs(mid-ax)+'px'});add('v',{left:mid+'px',top:Math.min(ay,by)+'px',height:Math.abs(by-ay)+'px'});add('h',{left:Math.min(mid,bx)+'px',top:by+'px',width:Math.abs(bx-mid)+'px'});add('dot',{left:mid+'px',top:by+'px'})}
function addConnectors(){[[74,89],[77,89],[73,90],[75,90],[83,93],[84,93],[81,94],[82,94],[89,97],[90,97],[93,98],[94,98],[97,101],[98,101],[101,103]].forEach(p=>connect(p[0],p[1],'right'));[[76,91],[78,91],[79,92],[80,92],[86,95],[88,95],[85,96],[87,96],[91,99],[92,99],[95,100],[96,100],[99,102],[100,102],[102,103]].forEach(p=>connect(p[0],p[1],'left'))}

async function fetchCsvText(url){
  const sep=url.includes('?')?'&':'?';
  const res=await fetch(url+sep+'_='+Date.now(), {cache:'no-store'});
  const text=await res.text();
  if(!res.ok) throw new Error('HTTP '+res.status+' from '+url);
  if(/^\s*</.test(text)) throw new Error('Received HTML instead of CSV from '+url);
  return text;
}
async function loadPublishedRows(){
  // Same pattern as standings.html: try the published CSV first, then the Google Visualization CSV endpoint.
  let text, source='published CSV';
  try{
    text=await fetchCsvText(CSV_URL);
  }catch(e1){
    console.warn('Published CSV failed, trying GViz CSV:', e1);
    source='GViz CSV';
    text=await fetchCsvText(GVIZ_URL);
  }
  const rows=parseCSV(text);
  if(rows.length<2) throw new Error(source+' loaded, but contained no data rows');
  return {rows, source};
}
async function loadData(){
  const st=document.getElementById('status');
  st.className='status';
  st.textContent='Loading published sheet…';
  try{
    const {rows,source}=await loadPublishedRows();
    const {counts,picks}=parseGroupConsensus(rows);
    const {ranks,third}=rankGroups(counts);
    render(getMatches(ranks,third));
    if(picks>0){
      st.className='status ok';
      st.textContent=`Loaded via ${source} · ${Math.max(rows.length-1,0)} data rows · ${Math.round(picks)} picks parsed`;
    }else{
      st.className='status err';
      st.textContent=`Loaded via ${source}, but no group picks were recognized. Check column headers / sheet layout.`;
    }
  }catch(e){
    render(getMatches({},[]));
    st.className='status err';
    st.textContent='Could not load the published sheet — showing bracket placeholders. '+e.message;
    console.error(e);
  }
}
document.getElementById('refreshBtn').addEventListener('click',loadData);loadData();
</script>
