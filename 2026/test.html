<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sextondelsfinaler – FIFA World Cup 2026</title>
<style>
  :root{
    --sand:#f5ead4; --sand2:#fff8eb; --navy:#081b33; --navy2:#123456;
    --gold:#c99a2e; --gold2:#f0cf77; --red:#c43a2f; --green:#157a52; --muted:#6f6a5f;
    --card:rgba(255,255,255,.72); --stroke:rgba(8,27,51,.14); --shadow:0 18px 50px rgba(8,27,51,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(circle at top left,#fff4d8 0,#f5ead4 32%,#ead8b7 100%);color:var(--navy);}
  body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,rgba(8,27,51,.05),transparent 35%,rgba(201,154,46,.12)),repeating-linear-gradient(135deg,rgba(8,27,51,.035) 0 1px,transparent 1px 18px);pointer-events:none}
  .wrap{position:relative;max-width:1120px;margin:0 auto;padding:30px 16px 70px}
  .hero{background:linear-gradient(135deg,var(--navy),#0c2b4f);color:#fff;border-radius:30px;padding:30px;box-shadow:var(--shadow);overflow:hidden;position:relative}
  .hero:after{content:"2026";position:absolute;right:-24px;bottom:-42px;font-weight:1000;font-size:120px;color:rgba(255,255,255,.06);letter-spacing:-8px}
  .kicker{color:var(--gold2);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:12px}
  .hero h1{margin:8px 0 6px;font-size:clamp(32px,5vw,58px);letter-spacing:-.05em;line-height:.95}
  .hero p{margin:0;max-width:680px;color:rgba(255,255,255,.82);font-size:17px}
  .deadline{display:inline-flex;gap:10px;align-items:center;margin-top:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:10px 14px;border-radius:999px;font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 330px;gap:18px;margin-top:18px}
  .panel{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--stroke);border-radius:26px;box-shadow:var(--shadow)}
  .main{padding:18px}.side{padding:18px;height:max-content;position:sticky;top:16px}
  .field{margin-bottom:16px}.field label{display:block;font-weight:900;margin:0 0 8px}
  .field input{width:100%;border:1px solid var(--stroke);border-radius:16px;padding:13px 14px;font-size:16px;background:#fff;color:var(--navy);outline:none}
  .match{background:rgba(255,255,255,.76);border:1px solid var(--stroke);border-radius:22px;margin:14px 0;padding:16px;position:relative;overflow:hidden}
  .match:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--gold),var(--navy2))}
  .matchTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
  .matchNo{font-weight:1000;color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .teams{font-size:21px;font-weight:1000;letter-spacing:-.03em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .teamName{display:inline-flex;align-items:center;gap:7px}.vs{color:var(--gold)}
  .flag{display:inline-flex;align-items:center;justify-content:center;width:27px;height:20px;vertical-align:middle;flex:0 0 auto}
  .flag img{width:27px;height:20px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(8,27,51,.13)}
  .flag .emoji{font-size:21px;line-height:1}
  .scoreRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
  .scoreBox span.label{display:block;font-size:13px;font-weight:900;color:var(--muted);margin-bottom:8px}
  .scoreBtns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .scoreBtns button{border:1px solid rgba(8,27,51,.16);background:#fff;border-radius:13px;padding:10px 0;font-weight:1000;color:var(--navy);cursor:pointer;transition:.15s}
  .scoreBtns button:hover{transform:translateY(-1px);border-color:var(--gold)}
  .scoreBtns button.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 8px 18px rgba(8,27,51,.25)}
  .dash{font-weight:1000;font-size:26px;margin-bottom:10px;color:var(--gold)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:18px;padding:14px 18px;font-size:16px;font-weight:1000;cursor:pointer}
  .primary{background:linear-gradient(135deg,var(--gold),#e1bd63);color:var(--navy);box-shadow:0 12px 28px rgba(201,154,46,.28)}.secondary{background:rgba(8,27,51,.08);color:var(--navy)}
  .status{margin-top:12px;padding:12px 14px;border-radius:16px;font-weight:800;display:none}.status.ok{display:block;background:rgba(21,122,82,.12);color:var(--green)}.status.err{display:block;background:rgba(196,58,47,.12);color:var(--red)}
  .mini{font-size:13px;color:var(--muted);line-height:1.45}.progress{height:10px;background:rgba(8,27,51,.1);border-radius:999px;overflow:hidden;margin:8px 0 12px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--navy));transition:.2s}.summary{display:grid;gap:8px}.summary div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(8,27,51,.15);padding:7px 0;font-weight:800;gap:8px}.hiddenFrame{display:none}.loading{padding:16px;border-radius:18px;background:rgba(255,255,255,.7);font-weight:900;color:var(--muted)}
  @media(max-width:860px){.grid{grid-template-columns:1fr}.side{position:static}.scoreRow{grid-template-columns:1fr}.dash{display:none}.hero{padding:24px}.scoreBtns button{padding:12px 0}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="kicker">FIFA World Cup 2026</div>
    <h1>Sextondelsfinaler</h1>
    <p>Tippa resultaten i sextondelarna.</p>
    <div class="deadline">⏰ Deadline 28/6 20:00</div>
  </section>

  <div class="grid">
    <main class="panel main">
      <div class="field">
        <label for="player">Ditt namn</label>
        <input id="player" autocomplete="name" placeholder="Skriv ditt namn" />
      </div>
      <div id="matches"><div class="loading">Laddar matcher…</div></div>
      <div class="actions">
        <button class="btn primary" id="submitBtn">Skicka tips</button>
        <button class="btn secondary" id="clearBtn" type="button">Rensa</button>
      </div>
      <div id="status" class="status"></div>
    </main>
    <aside class="panel side">
      <h2 style="margin:0 0 8px;letter-spacing:-.04em">Din kupong</h2>
      <p class="mini">Fyll i alla matcher. När du skickar sparas svaret i samma Google Form.</p>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="summary" class="summary"></div>
    </aside>
  </div>
</div>
<iframe name="hidden_google_submit" class="hiddenFrame"></iframe>
<script>
const CONFIG = {
  csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGpUvuPP93ZzIzy7ni6CuRCeKX2XMVq0Nof1GF1OC3Vem8Nn4Om3sah68frwTmSOC4KuyJOphYmBLg/pub?gid=0&single=true&output=csv',
  targetType: 'Sextondelsfinaler',
  formAction: 'https://docs.google.com/forms/d/1XtP4u-JLtnGQgNZxoyT66sG54zJimeqjZmpO2vo9qD8/formResponse',
  playerEntryId: 'entry.PLAYER_NAME',

  // Keep your existing Google Forms entry IDs here.
  // Match numbers are loaded from the CSV, so only the IDs need to be mapped.
  matchEntryIds: {
    73: { home: 'entry.MATCH_73_HOME', away: 'entry.MATCH_73_AWAY' },
    74: { home: 'entry.MATCH_74_HOME', away: 'entry.MATCH_74_AWAY' },
    75: { home: 'entry.MATCH_75_HOME', away: 'entry.MATCH_75_AWAY' },
    76: { home: 'entry.MATCH_76_HOME', away: 'entry.MATCH_76_AWAY' },
    77: { home: 'entry.MATCH_77_HOME', away: 'entry.MATCH_77_AWAY' },
    78: { home: 'entry.MATCH_78_HOME', away: 'entry.MATCH_78_AWAY' },
    79: { home: 'entry.MATCH_79_HOME', away: 'entry.MATCH_79_AWAY' },
    80: { home: 'entry.MATCH_80_HOME', away: 'entry.MATCH_80_AWAY' },
    81: { home: 'entry.MATCH_81_HOME', away: 'entry.MATCH_81_AWAY' },
    82: { home: 'entry.MATCH_82_HOME', away: 'entry.MATCH_82_AWAY' },
    83: { home: 'entry.MATCH_83_HOME', away: 'entry.MATCH_83_AWAY' },
    84: { home: 'entry.MATCH_84_HOME', away: 'entry.MATCH_84_AWAY' },
    85: { home: 'entry.MATCH_85_HOME', away: 'entry.MATCH_85_AWAY' },
    86: { home: 'entry.MATCH_86_HOME', away: 'entry.MATCH_86_AWAY' },
    87: { home: 'entry.MATCH_87_HOME', away: 'entry.MATCH_87_AWAY' },
    88: { home: 'entry.MATCH_88_HOME', away: 'entry.MATCH_88_AWAY' }
  }
};

const SCORES = ['0','1','2','3','4','5+'];
const state = {};
let matches = [];
const isWindows = /Windows/i.test(navigator.userAgent);

const FLAG_MAP = {
  'Mexico': ['mx','🇲🇽'], 'Rep. of Korea': ['kr','🇰🇷'], 'South Korea': ['kr','🇰🇷'], 'Korea Republic': ['kr','🇰🇷'], 'Czech Rep.': ['cz','🇨🇿'], 'Czech Republic': ['cz','🇨🇿'], 'South Africa': ['za','🇿🇦'],
  'Switzerland': ['ch','🇨🇭'], 'Bosnia/Herzeg.': ['ba','🇧🇦'], 'Bosnia & Herzegovina': ['ba','🇧🇦'], 'Canada': ['ca','🇨🇦'], 'Qatar': ['qa','🇶🇦'],
  'Brazil': ['br','🇧🇷'], 'Morocco': ['ma','🇲🇦'], 'Scotland': ['gb-sct','🏴'], 'Haiti': ['ht','🇭🇹'],
  'Turkey': ['tr','🇹🇷'], 'USA': ['us','🇺🇸'], 'United States': ['us','🇺🇸'], 'Australia': ['au','🇦🇺'], 'Paraguay': ['py','🇵🇾'],
  'Germany': ['de','🇩🇪'], 'Ecuador': ['ec','🇪🇨'], 'Ivory Coast': ['ci','🇨🇮'], 'Curaçao': ['cw','🇨🇼'], 'Curacao': ['cw','🇨🇼'],
  'Japan': ['jp','🇯🇵'], 'Netherlands': ['nl','🇳🇱'], 'Sweden': ['se','🇸🇪'], 'Tunisia': ['tn','🇹🇳'],
  'Belgium': ['be','🇧🇪'], 'Egypt': ['eg','🇪🇬'], 'IR Iran': ['ir','🇮🇷'], 'Iran': ['ir','🇮🇷'], 'New Zealand': ['nz','🇳🇿'],
  'Spain': ['es','🇪🇸'], 'Uruguay': ['uy','🇺🇾'], 'Saudi Arabia': ['sa','🇸🇦'], 'Cape Verde': ['cv','🇨🇻'],
  'France': ['fr','🇫🇷'], 'Senegal': ['sn','🇸🇳'], 'Norway': ['no','🇳🇴'], 'Iraq': ['iq','🇮🇶'],
  'Argentina': ['ar','🇦🇷'], 'Algeria': ['dz','🇩🇿'], 'Austria': ['at','🇦🇹'], 'Jordan': ['jo','🇯🇴'],
  'Portugal': ['pt','🇵🇹'], 'Colombia': ['co','🇨🇴'], 'Uzbekistan': ['uz','🇺🇿'], 'DR Congo': ['cd','🇨🇩'],
  'England': ['gb-eng','🏴'], 'Croatia': ['hr','🇭🇷'], 'Ghana': ['gh','🇬🇭'], 'Panama': ['pa','🇵🇦']
};

function parseCSV(text){
  const rows=[]; let row=[], cell='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"' && inQuotes && n==='"'){ cell+='"'; i++; }
    else if(c==='"'){ inQuotes=!inQuotes; }
    else if(c===',' && !inQuotes){ row.push(cell); cell=''; }
    else if((c==='\n' || c==='\r') && !inQuotes){
      if(c==='\r' && n==='\n') i++;
      row.push(cell); if(row.some(v=>String(v).trim()!=='')) rows.push(row); row=[]; cell='';
    } else cell+=c;
  }
  row.push(cell); if(row.some(v=>String(v).trim()!=='')) rows.push(row);
  return rows;
}

function normalize(s){ return String(s || '').trim(); }
function keyFor(headers, wanted){
  const lower = headers.map(h => normalize(h).toLowerCase());
  for(const w of wanted){ const idx = lower.indexOf(w.toLowerCase()); if(idx >= 0) return idx; }
  return -1;
}
function matchTypeIsTarget(type){
  const t = normalize(type).toLowerCase();
  return t === CONFIG.targetType.toLowerCase() || t === 'sextondel' || t === 'sextondelsfinal';
}
function flagHtml(team){
  const hit = FLAG_MAP[normalize(team)];
  if(!hit) return '';
  const [code, emoji] = hit;
  const img = `<img src="https://flagcdn.com/w40/${code}.png" alt="${team}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">`;
  const emojiSpan = `<span class="emoji" style="display:${isWindows ? 'none' : 'inline'}">${emoji}</span>`;
  return `<span class="flag">${isWindows ? img + emojiSpan : emojiSpan + img.replace('<img','<img style="display:none"')}</span>`;
}
function teamHtml(team){ return `<span class="teamName">${flagHtml(team)}<span>${team}</span></span>`; }
function getEntries(matchNo){ return CONFIG.matchEntryIds[String(matchNo)] || CONFIG.matchEntryIds[matchNo] || {}; }
function hasRealConfig(){
  const all = JSON.stringify(CONFIG.matchEntryIds) + CONFIG.playerEntryId;
  return !all.includes('MATCH_') && !all.includes('PLAYER_NAME') && CONFIG.playerEntryId.startsWith('entry.');
}

async function loadMatches(){
  const root=document.getElementById('matches');
  try{
    const res = await fetch(CONFIG.csvUrl, { cache: 'no-store' });
    if(!res.ok) throw new Error(`CSV kunde inte laddas (${res.status})`);
    const rows = parseCSV(await res.text());
    const headers = rows[0].map(normalize);
    const iMatch = keyFor(headers, ['Match','Match No','Match #','Nr']);
    const iHome = keyFor(headers, ['Team 1','Home','Team 1/Home','Hemmalag']);
    const iAway = keyFor(headers, ['Team 2','Away','Team 2/Away','Bortalag']);
    const iType = keyFor(headers, ['Type','Round','Runda']);
    if([iMatch,iHome,iAway,iType].some(i=>i<0)) throw new Error('CSV saknar någon av kolumnerna Match, Team 1, Team 2 eller Type.');
    matches = rows.slice(1).map(r => ({
      match: normalize(r[iMatch]), home: normalize(r[iHome]), away: normalize(r[iAway]), type: normalize(r[iType])
    })).filter(m => m.match && m.home && m.away && matchTypeIsTarget(m.type));
    if(!matches.length) throw new Error('Hittade inga matcher med Type = Sextondelsfinaler.');
    render();
  } catch(err){
    root.innerHTML = `<div class="status err" style="display:block">${err.message}</div>`;
  }
}

function render(){
  const root=document.getElementById('matches'); root.innerHTML='';
  matches.forEach(m=>{
    state[m.match] ||= {home:null, away:null};
    const el=document.createElement('section'); el.className='match';
    el.innerHTML=`<div class="matchTop"><div><div class="matchNo">Match ${m.match}</div><div class="teams">${teamHtml(m.home)} <span class="vs">vs</span> ${teamHtml(m.away)}</div></div></div>
    <div class="scoreRow"><div class="scoreBox"><span class="label">${teamHtml(m.home)}</span><div class="scoreBtns" data-match="${m.match}" data-side="home"></div></div><div class="dash">–</div><div class="scoreBox"><span class="label">${teamHtml(m.away)}</span><div class="scoreBtns" data-match="${m.match}" data-side="away"></div></div></div>`;
    root.appendChild(el);
  });
  document.querySelectorAll('.scoreBtns').forEach(box=>{
    SCORES.forEach(s=>{ const b=document.createElement('button'); b.type='button'; b.textContent=s; b.onclick=()=>{state[box.dataset.match][box.dataset.side]=s; update(); renderButtons();}; box.appendChild(b); });
  });
  renderButtons(); update();
}
function renderButtons(){
  document.querySelectorAll('.scoreBtns').forEach(box=>{
    [...box.children].forEach(b=>b.classList.toggle('active', state[box.dataset.match][box.dataset.side]===b.textContent));
  });
}
function update(){
  const total=matches.length*2+1; let done=document.getElementById('player').value.trim()?1:0;
  matches.forEach(m=>{ if(state[m.match]?.home!==null) done++; if(state[m.match]?.away!==null) done++; });
  document.getElementById('bar').style.width = total ? Math.round(done/total*100)+'%' : '0%';
  document.getElementById('summary').innerHTML = matches.map(m=>`<div><span>#${m.match} ${m.home}-${m.away}</span><b>${state[m.match]?.home ?? '–'} - ${state[m.match]?.away ?? '–'}</b></div>`).join('');
}
document.getElementById('player').addEventListener('input', update);
document.getElementById('clearBtn').onclick=()=>{document.getElementById('player').value=''; Object.keys(state).forEach(k=>state[k]={home:null,away:null}); renderButtons(); update();};
document.getElementById('submitBtn').onclick=()=>{
  const status=document.getElementById('status'); status.className='status'; status.textContent='';
  const player=document.getElementById('player').value.trim();
  if(!matches.length){status.className='status err'; status.textContent='Matcherna har inte laddats ännu.'; return;}
  if(!player){status.className='status err'; status.textContent='Skriv ditt namn först.'; return;}
  for(const m of matches){ if(state[m.match].home===null || state[m.match].away===null){status.className='status err'; status.textContent=`Fyll i Match ${m.match}.`; return;} }
  if(!hasRealConfig()){status.className='status err'; status.textContent='Entry IDs saknas i CONFIG.'; return;}
  const form=document.createElement('form'); form.method='POST'; form.action=CONFIG.formAction; form.target='hidden_google_submit'; form.style.display='none';
  const add=(name,value)=>{const input=document.createElement('input'); input.name=name; input.value=value; form.appendChild(input);};
  add(CONFIG.playerEntryId, player);
  matches.forEach(m=>{ const ids=getEntries(m.match); add(ids.home, state[m.match].home); add(ids.away, state[m.match].away); });
  document.body.appendChild(form); form.submit(); form.remove();
  status.className='status ok'; status.textContent='Skickat! Svaret bör nu vara sparat i Google Forms.';
};
loadMatches();
</script>
</body>
</html>
