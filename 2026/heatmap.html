<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA 2026 Prediction Heatmaps</title>
<style>
:root{--navy:#061B49;--green:#76e076;--green-dark:#4fbf4f;--line:#dfe5df;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy);background:radial-gradient(circle at top left,rgba(118,224,118,.16),transparent 430px),linear-gradient(135deg,#fbfffb,#eef6f0)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid #e1e7e1}
.header-inner{max-width:1480px;margin:0 auto;padding:18px 22px;display:flex;justify-content:space-between;gap:18px;align-items:center}
h1{margin:0;font-size:clamp(24px,3vw,44px);letter-spacing:-.045em;line-height:1;font-weight:950}h1 span{color:var(--green-dark)}
.meta{font-size:13px;color:var(--muted);font-weight:750;margin-top:5px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
label.file,button{border:1px solid #d6dfd6;background:#fff;color:var(--navy);border-radius:999px;padding:10px 15px;font-weight:850;cursor:pointer;font-size:14px}
label.file{background:var(--navy);color:#fff;border-color:var(--navy)}input[type=file]{display:none}
main{max-width:1480px;margin:0 auto;padding:24px 22px 70px}.panel{background:rgba(255,255,255,.88);border:1px solid #e1e7e1;border-radius:22px;padding:16px;margin-bottom:20px;box-shadow:0 14px 38px rgba(6,27,73,.05)}
.search-row{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:240px;border:1px solid #d6dfd6;border-radius:999px;padding:11px 15px;font-weight:750;color:var(--navy);font-size:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tab{box-shadow:none}.tab.active{background:var(--green-dark);color:#fff;border-color:var(--green-dark)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:22px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(280px,1fr))}}@media(max-width:720px){.header-inner{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}}
.card{position:relative;overflow:hidden;background:#fff;border:1px solid #e1e7e1;border-radius:24px;padding:18px 20px 23px;box-shadow:0 18px 45px rgba(6,27,73,.07);min-height:505px}
.card:after{content:"";position:absolute;right:0;bottom:0;width:120px;height:88px;background:linear-gradient(135deg,transparent 49%,#b4eeb4 50%)}.card:before{content:"";position:absolute;right:0;bottom:0;width:80px;height:60px;background:linear-gradient(135deg,transparent 49%,var(--navy) 50%);z-index:1}
.ribbon{position:absolute;top:0;left:0;width:118px;height:44px;background:var(--navy);color:#fff;clip-path:polygon(0 0,100% 0,78% 100%,0 100%);display:flex;align-items:center;padding-left:18px;font-size:20px;font-weight:950}
.md{position:absolute;top:18px;right:22px;color:var(--green-dark);font-weight:950;font-size:14px}.date{text-align:center;font-weight:900;font-size:14px;margin-top:2px}
.teams{margin-top:46px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.team{text-align:center;text-transform:uppercase;font-weight:950;letter-spacing:-.055em;line-height:.95;font-size:clamp(20px,2.2vw,31px)}.vs{color:var(--green-dark);font-weight:950}
.outcome-title{text-align:center;color:var(--green-dark);font-weight:950;font-size:12px;margin:24px 0 8px}.outcomes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.pill{border-radius:10px;border:1px solid #dfe5df;overflow:hidden;text-align:center;background:#f3f7f3}.pct{padding:7px 4px 4px;font-weight:950;font-size:22px}.label{padding:4px 4px 7px;background:rgba(255,255,255,.68);font-size:10px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home{background:linear-gradient(180deg,#b4eeb4,#76e076)}.draw{background:linear-gradient(180deg,#f7faf7,#edf4ed)}.away{background:linear-gradient(180deg,#def7de,#b4eeb4)}
.popular{text-align:center;color:var(--muted);font-size:12px;font-weight:800;margin:8px 0 12px}.popular b{color:var(--navy)}
.matrix-wrap{position:relative;width:min(100%,390px);margin:0 auto;padding-top:24px;padding-left:40px}.axis-x{position:absolute;top:0;left:40px;right:0;text-align:center;font-size:12px;font-weight:950}.axis-y{position:absolute;left:-19px;top:49%;transform:rotate(-90deg) translateY(-50%);transform-origin:center;color:var(--green-dark);font-size:12px;font-weight:950;white-space:nowrap}
.x-labels,.heat-row{display:grid;grid-template-columns:repeat(5,1fr)}.x-labels{text-align:center;font-size:12px;font-weight:950;margin-bottom:4px}.heat-body{display:grid;grid-template-columns:28px 1fr}.y-labels{display:grid;grid-template-rows:repeat(5,1fr);text-align:center;font-size:12px;font-weight:950}.y-labels div{display:flex;align-items:center;justify-content:center}.heat-grid{border:1px solid var(--line);display:grid;grid-template-rows:repeat(5,1fr)}
.cell{min-height:42px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}.heat-row .cell:last-child{border-right:0}.heat-row:last-child .cell{border-bottom:0}.predictions{text-align:center;margin-top:18px;font-weight:950;font-size:12px;letter-spacing:.03em}
.empty{display:none;text-align:center;background:#fff;border:1px solid #e1e7e1;border-radius:22px;padding:40px;color:var(--muted);font-weight:850}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(6,27,73,.42); backdrop-filter:blur(6px);
  z-index:99; display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(540px,100%); max-height:min(720px,90vh); overflow:hidden;
  background:#fff; border:1px solid #dfe5df; border-radius:24px;
  box-shadow:0 28px 90px rgba(6,27,73,.28); color:var(--navy);
}
.modal-head{padding:20px 22px 14px;border-bottom:1px solid #e8eee8;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.modal-title{font-size:22px;font-weight:950;line-height:1.05;letter-spacing:-.035em;margin:0}
.modal-sub{margin-top:7px;color:var(--muted);font-weight:800;font-size:13px}
.modal-close{width:36px;height:36px;border-radius:999px;padding:0;line-height:1;display:flex;align-items:center;justify-content:center;font-size:20px}
.modal-body{padding:16px 22px 22px;overflow:auto;max-height:560px}
.name-list{display:grid;gap:8px;margin-top:12px}
.name-item{padding:10px 12px;border:1px solid #e5ece5;border-radius:12px;background:#fbfffb;font-weight:800}
.modal-empty{padding:22px;border:1px dashed #d5ddd5;border-radius:16px;color:var(--muted);text-align:center;font-weight:850;background:#fbfffb}
.cell{cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
.cell:hover{transform:scale(1.04);box-shadow:0 5px 16px rgba(6,27,73,.14);z-index:2}


.stage-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stage-tab{box-shadow:none}
.stage-tab.active{background:var(--green-dark);color:#fff;border-color:var(--green-dark)}
.status{font-size:12px;color:var(--muted);font-weight:800;margin-top:10px}
.error{display:none;color:#9b1c1c;background:#fff0f0;border:1px solid #f0b6b6;border-radius:14px;padding:12px 14px;margin-bottom:18px;font-weight:800}

@media print{header,.panel{display:none}body{background:#fff}main{max-width:none;padding:0}.grid{grid-template-columns:repeat(3,1fr);gap:10px}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header><div class="header-inner"><div><h1>FIFA WORLD CUP <span>2026</span></h1><div class="meta" id="meta"></div></div><div class="controls"><label class="file" for="csvInput">Upload updated CSV</label><input id="csvInput" type="file" accept=".csv,text/csv"><button id="reloadBtn">Reload live CSV</button><button onclick="window.print()">Print / Save PDF</button></div></div></header>
<main>
<section class="panel"><div class="stage-tabs" id="stageTabs"></div><div class="search-row"><input class="search" id="teamSearch" placeholder="Search by team..."><button id="clearSearch">Clear</button></div><div class="tabs" id="tabs"></div><div class="status" id="status">Loading live CSV…</div></section><div class="error" id="errorBox"></div>
<section class="grid" id="cards"></section><div class="empty" id="empty">No matches found for this filter.</div>
</main>

<div class="modal-backdrop" id="predictionModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div>
        <h2 class="modal-title" id="modalTitle">Prediction details</h2>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTtuCy2jTbWd00mfGYs_QPMSe8ZRTCsqpCw5P_0Rm_AOn5LbJC5ebiK4TUnuXaVlz9wUJnRVixThC1j/pub?gid=0&single=true&output=csv";
const buckets=["0","1","2","3","4+"];
let allMatches=[],activeMD="ALL",activeStage="ALL",searchTerm="";
const stages=[{id:"ALL",label:"All",from:1,to:999},{id:"GROUP",label:"Group stage",from:1,to:72},{id:"R32",label:"Round of 32",from:73,to:88},{id:"R16",label:"Round of 16",from:89,to:96},{id:"QF",label:"Quarters",from:97,to:100},{id:"SF",label:"Semis",from:101,to:102},{id:"FINAL",label:"Finals",from:103,to:104}];
function parseCSV(text){const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const ch=text[i],n=text[i+1];if(ch=='"'&&q&&n=='"'){cell+='"';i++}else if(ch=='"'){q=!q}else if(ch==","&&!q){row.push(cell);cell=""}else if((ch=="\n"||ch=="\r")&&!q){if(ch=="\r"&&n=="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=ch}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()!==""))}
function n(v){const x=Number(String(v??"").replace(",",".").trim());return Number.isFinite(x)?x:null}
function meta(v){if(v==null)return"";const s=String(v).trim(),x=Number(s);return Number.isFinite(x)&&String(x)===s?String(Math.trunc(x)):s}
function shortName(t){return {"Bosnia/Herzeg.":"Bosnia","Rep. of Korea":"Korea","South Africa":"S. Africa","New Zealand":"N. Zealand"}[t]||t}
function pct(a,b){return b?Math.round(a/b*100):0}
function heatColor(value,max){if(value===0)return"#fff";const stops=[[242,252,242],[222,247,222],[201,243,201],[180,238,180],[159,233,159],[138,229,138],[118,224,118]];const t=max?value/max:0,s=t*(stops.length-1),i=Math.min(stops.length-2,Math.floor(s)),f=s-i,a=stops[i],b=stops[i+1],rgb=a.map((v,j)=>Math.round(v+(b[j]-v)*f));return`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`}
function buildMatches(rows){
const md=rows[0].slice(1),dates=rows[1].slice(1),mn=rows[2].slice(1),teams=rows[4].slice(1),raw=rows.slice(5).filter(r=>{const name=String(r[0]??"").trim();return name&&r.slice(1).some(c=>String(c??"").trim()!=="")}),matches=[];
for(let c=0;c+1<teams.length;c+=2){
  const home=String(teams[c]??"").trim(),away=String(teams[c+1]??"").trim();
  if(!home||!away)continue;
  const matrix=Array.from({length:5},()=>Array(5).fill(0));
  const names=Array.from({length:5},()=>Array.from({length:5},()=>[]));
  let valid=0,hw=0,aw=0,d=0;
  for(const row of raw){
    const predictor=String(row[0]??"").trim();
    const vals=row.slice(1);
    const h=n(vals[c]),a=n(vals[c+1]);
    if(h==null||a==null)continue;
    valid++;
    if(h>a)hw++;else if(a>h)aw++;else d++;
    const hb=Math.min(Math.max(Math.trunc(h),0),4);
    const ab=Math.min(Math.max(Math.trunc(a),0),4);
    matrix[hb][ab]++;
    names[hb][ab].push(predictor);
  }
  matches.push({home,away,matchday:meta(md[c]),date:meta(dates[c]),matchNo:meta(mn[c])||String(matches.length+1),matrix,names,valid,homePct:pct(hw,valid),drawPct:pct(d,valid),awayPct:pct(aw,valid)})
}
return matches}
function mostPopular(m){let best=0,p=[];for(let h=0;h<5;h++)for(let a=0;a<5;a++){const v=m.matrix[h][a];if(v>best){best=v;p=[[h,a]]}else if(v===best&&v>0)p.push([h,a])}if(!best)return"Most predicted: —";const score=p.slice(0,3).map(([h,a])=>`${buckets[h]}-${buckets[a]}`).join(", ");return`Most predicted: <b>${score}</b> (${best}, ${pct(best,m.valid)}%)`}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[ch]))}
function cardHTML(m){
const max=Math.max(1,...m.matrix.flat()),x=buckets.map(b=>`<div>${b}</div>`).join(""),y=buckets.map(b=>`<div>${b}</div>`).join("");
const rows=buckets.map((_,h)=>`<div class="heat-row">${buckets.map((_,a)=>{
  const v=m.matrix[h][a];
  const payload=encodeURIComponent(JSON.stringify({matchNo:m.matchNo,home:m.home,away:m.away,date:m.date,matchday:m.matchday,homeScore:buckets[h],awayScore:buckets[a],count:v,names:m.names[h][a]||[]}));
  return `<div class="cell" data-prediction="${payload}" title="${esc(m.home)} ${buckets[h]}-${buckets[a]} ${esc(m.away)}: ${v}" style="background:${heatColor(v,max)}">${v}</div>`
}).join("")}</div>`).join("");
return`<article class="card"><div class="ribbon">#${m.matchNo}</div><div class="date">${m.date}</div><div class="md">MD ${m.matchday}</div><div class="teams"><div class="team">${shortName(m.home)}</div><div class="vs">VS</div><div class="team">${shortName(m.away)}</div></div><div class="outcome-title">PREDICTED OUTCOME</div><div class="outcomes"><div class="pill home"><div class="pct">${m.homePct}%</div><div class="label">${shortName(m.home).toUpperCase()} WIN</div></div><div class="pill draw"><div class="pct">${m.drawPct}%</div><div class="label">DRAW</div></div><div class="pill away"><div class="pct">${m.awayPct}%</div><div class="label">${shortName(m.away).toUpperCase()} WIN</div></div></div><div class="popular">${mostPopular(m)}</div><div class="matrix-wrap"><div class="axis-x">AWAY TEAM</div><div class="axis-y">HOME TEAM</div><div class="x-labels">${x}</div><div class="heat-body"><div class="y-labels">${y}</div><div class="heat-grid">${rows}</div></div></div><div class="predictions">${m.valid} PREDICTIONS</div></article>`}
function renderStageTabs(){
document.getElementById("stageTabs").innerHTML=stages.map(s=>`<button class="stage-tab ${activeStage===s.id?"active":""}" data-stage="${s.id}">${s.label}</button>`).join("");
document.querySelectorAll(".stage-tab").forEach(b=>b.onclick=()=>{activeStage=b.dataset.stage;activeMD="ALL";renderCards()})
}
function matchNumber(m){const no=Number(m.matchNo);return Number.isFinite(no)?no:0}
function filteredByStage(list){const s=stages.find(x=>x.id===activeStage)||stages[0];return list.filter(m=>s.id==="ALL"||(matchNumber(m)>=s.from&&matchNumber(m)<=s.to))}
function renderTabs(){const mds=[...new Set(filteredByStage(allMatches).map(m=>m.matchday).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));document.getElementById("tabs").innerHTML=["ALL",...mds].map(md=>`<button class="tab ${activeMD===md?"active":""}" data-md="${md}">${md==="ALL"?"ALL":`MD ${md}`}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeMD=b.dataset.md;renderCards()})}
function filtered(){const q=searchTerm.trim().toLowerCase();return filteredByStage(allMatches).filter(m=>(activeMD==="ALL"||m.matchday===activeMD)&&(!q||m.home.toLowerCase().includes(q)||m.away.toLowerCase().includes(q)))}
function renderCards(){renderStageTabs();renderTabs();const list=filtered();document.getElementById("cards").innerHTML=list.map(cardHTML).join("");document.getElementById("empty").style.display=list.length?"none":"block";document.getElementById("meta").textContent=`${list.length} shown • ${allMatches.length} total matches`}
function render(csv){allMatches=buildMatches(parseCSV(csv));activeMD="ALL";searchTerm="";document.getElementById("teamSearch").value="";renderCards()}
async function loadLiveCsv(){
 const status=document.getElementById("status"),err=document.getElementById("errorBox");
 status.textContent="Loading live CSV…";err.style.display="none";
 try{
   const res=await fetch(CSV_URL+"&cachebust="+Date.now(),{cache:"no-store"});
   if(!res.ok)throw new Error(`HTTP ${res.status}`);
   const text=await res.text();
   render(text);
   status.textContent=`Loaded live CSV: ${new Date().toLocaleString()}`;
 }catch(e){
   err.textContent="Could not load the published CSV. Check that the Google Sheet is published to web and accessible. Error: "+e.message;
   err.style.display="block";
   status.textContent="Live CSV failed to load.";
 }
}
document.getElementById("reloadBtn").addEventListener("click",loadLiveCsv);document.getElementById("csvInput").addEventListener("change",async e=>{const f=e.target.files[0];if(f){render(await f.text());document.getElementById("status").textContent="Loaded uploaded CSV file."}});
document.getElementById("teamSearch").addEventListener("input",e=>{searchTerm=e.target.value;renderCards()});
document.getElementById("clearSearch").addEventListener("click",()=>{searchTerm="";document.getElementById("teamSearch").value="";renderCards()});

function openPredictionModal(data){
  const modal=document.getElementById("predictionModal");
  document.getElementById("modalTitle").textContent=`#${data.matchNo} • ${data.home} ${data.homeScore}-${data.awayScore} ${data.away}`;
  document.getElementById("modalSub").textContent=`MD ${data.matchday} • ${data.date} • ${data.count} prediction${data.count===1?"":"s"}`;
  const body=document.getElementById("modalBody");
  if(!data.names||data.names.length===0){
    body.innerHTML=`<div class="modal-empty">No one predicted this scoreline.</div>`;
  }else{
    body.innerHTML=`<div class="name-list">${data.names.map(name=>`<div class="name-item">${esc(name)}</div>`).join("")}</div>`;
  }
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
}
function closePredictionModal(){
  const modal=document.getElementById("predictionModal");
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
}
document.getElementById("modalClose").addEventListener("click",closePredictionModal);
document.getElementById("predictionModal").addEventListener("click",e=>{if(e.target.id==="predictionModal")closePredictionModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePredictionModal()});
document.addEventListener("click",e=>{
  const cell=e.target.closest(".cell[data-prediction]");
  if(!cell)return;
  openPredictionModal(JSON.parse(decodeURIComponent(cell.dataset.prediction)));
});

loadLiveCsv();
</script>
</body></html>
