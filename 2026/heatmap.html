function heatColor(value,max){if(value===0)return"#fff";const stops=[[242,252,242],[222,247,222],[201,243,201],[180,238,180],[159,233,159],[138,229,138],[118,224,118]];const t=max?value/max:0,s=t*(stops.length-1),i=Math.min(stops.length-2,Math.floor(s)),f=s-i,a=stops[i],b=stops[i+1],rgb=a.map((v,j)=>Math.round(v+(b[j]-v)*f));return`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`}
function buildMatches(rows){const md=rows[0].slice(1),dates=rows[1].slice(1),mn=rows[2].slice(1),teams=rows[4].slice(1),raw=rows.slice(5).filter(r=>{const name=String(r[0]??"").trim();return name&&r.slice(1).some(c=>String(c??"").trim()!=="")}).map(r=>r.slice(1)),matches=[];for(let c=0;c+1<teams.length;c+=2){const home=String(teams[c]??"").trim(),away=String(teams[c+1]??"").trim();if(!home||!away)continue;const matrix=Array.from({length:5},()=>Array(5).fill(0));let valid=0,hw=0,aw=0,d=0;for(const r of raw){const h=n(r[c]),a=n(r[c+1]);if(h==null||a==null)continue;valid++;if(h>a)hw++;else if(a>h)aw++;else d++;matrix[Math.min(Math.max(Math.trunc(h),0),4)][Math.min(Math.max(Math.trunc(a),0),4)]++}matches.push({home,away,matchday:meta(md[c]),date:meta(dates[c]),matchNo:meta(mn[c])||String(matches.length+1),matrix,valid,homePct:pct(hw,valid),drawPct:pct(d,valid),awayPct:pct(aw,valid)})}return matches}
function mostPopular(m){let best=0,p=[];for(let h=0;h<5;h++)for(let a=0;a<5;a++){const v=m.matrix[h][a];if(v>best){best=v;p=[[h,a]]}else if(v===best&&v>0)p.push([h,a])}if(!best)return"Most predicted: —";const score=p.slice(0,3).map(([h,a])=>`${buckets[h]}-${buckets[a]}`).join(", ");return`Most predicted: <b>${score}</b> (${best}, ${pct(best,m.valid)}%)`}
function cardHTML(m){const max=Math.max(1,...m.matrix.flat()),x=buckets.map(b=>`<div>${b}</div>`).join(""),y=buckets.map(b=>`<div>${b}</div>`).join("");const rows=buckets.map((_,h)=>`<div class="heat-row">${buckets.map((_,a)=>{const v=m.matrix[h][a];return`<div class="cell" title="${m.home} ${buckets[h]}-${buckets[a]} ${m.away}: ${v}" style="background:${heatColor(v,max)}">${v}</div>`}).join("")}</div>`).join("");return`<article class="card"><div class="ribbon">#${m.matchNo}</div><div class="date">${m.date}</div><div class="md">MD ${m.matchday}</div><div class="teams"><div class="team">${shortName(m.home)}</div><div class="vs">VS</div><div class="team">${shortName(m.away)}</div></div><div class="outcome-title">PREDICTED OUTCOME</div><div class="outcomes"><div class="pill home"><div class="pct">${m.homePct}%</div><div class="label">${shortName(m.home).toUpperCase()} WIN</div></div><div class="pill draw"><div class="pct">${m.drawPct}%</div><div class="label">DRAW</div></div><div class="pill away"><div class="pct">${m.awayPct}%</div><div class="label">${shortName(m.away).toUpperCase()} WIN</div></div></div><div class="popular">${mostPopular(m)}</div><div class="matrix-wrap"><div class="axis-x">AWAY TEAM</div><div class="axis-y">HOME TEAM</div><div class="x-labels">${x}</div><div class="heat-body"><div class="y-labels">${y}</div><div class="heat-grid">${rows}</div></div></div><div class="predictions">${m.valid} PREDICTIONS</div></article>`}
function renderTabs(){const mds=[...new Set(allMatches.map(m=>m.matchday).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));document.getElementById("tabs").innerHTML=["ALL",...mds].map(md=>`<button class="tab ${activeMD===md?"active":""}" data-md="${md}">${md==="ALL"?"ALL":`MD ${md}`}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeMD=b.dataset.md;renderCards()})}
function filtered(){const q=searchTerm.trim().toLowerCase();return allMatches.filter(m=>(activeMD==="ALL"||m.matchday===activeMD)&&(!q||m.home.toLowerCase().includes(q)||m.away.toLowerCase().includes(q)))}
function renderCards(){renderTabs();const list=filtered();document.getElementById("cards").innerHTML=list.map(cardHTML).join("");document.getElementById("empty").style.display=list.length?"none":"block";document.getElementById("meta").textContent=`${list.length} shown • ${allMatches.length} total matches`}
function render(csv){allMatches=buildMatches(parseCSV(csv));activeMD="ALL";searchTerm="";document.getElementById("teamSearch").value="";renderCards()}
document.getElementById("csvInput").addEventListener("change",async e=>{const f=e.target.files[0];if(f)render(await f.text())});
document.getElementById("teamSearch").addEventListener("input",e=>{searchTerm=e.target.value;renderCards()});
document.getElementById("clearSearch").addEventListener("click",()=>{searchTerm="";document.getElementById("teamSearch").value="";renderCards()});
render(embeddedCsv);
</script>
</body></html>
